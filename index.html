<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yıldız Blok • ExBlock uyarlaması</title><style>*{box-sizing:border-box}body{margin:0;background:#080c18;color:#e0e8f6;font-family:monospace;display:grid;place-items:center;min-height:100dvh}main{width:min(96vw,760px);padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;color:#7fff57}small{color:#95a2b9}canvas{width:100%;display:block;background:#020409;border:3px solid #495266;border-radius:4px;touch-action:none;margin:18px 0;image-rendering:pixelated}button{background:#17243a;color:white;border:1px solid #72819c;padding:12px 20px;font:inherit;cursor:pointer;border-radius:4px}button:hover{background:#294165}.controls{display:flex;gap:10px;justify-content:center}p{text-align:center;color:#95a2b9;line-height:1.7}#status{font-size:14px}</style><main><header><div><h1>YILDIZ BLOK</h1><small>ExBlock’tan esinlenen bağımsız uyarlama</small></div><span id="status"></span></header><canvas width="720" height="540" aria-label="Tuğla kırma oyun alanı"></canvas><div class="controls"><button id="left" aria-label="Sola git">◀</button><button id="play">Başlat / Topu at</button><button id="pause">Duraklat</button><button id="right" aria-label="Sağa git">▶</button><button id="reset" aria-label="Yeniden başlat">↻</button></div><p>← → / A D: hareket · Boşluk / Enter: topu at · P: duraklat<br>Telefonda oyun alanını sürükle veya yön düğmelerini basılı tut.</p></main><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const W=720,H=540,paddle={x:300,y:492,w:112,h:12},ball={x:356,y:482,vx:170,vy:-260,r:6};
let score=0,lives=3,level=1,bricks=[],launched=false,paused=false,over=false,won=false,last=0,accumulator=0;const keys=new Set();
const stars=Array.from({length:85},(_,i)=>({x:(i*137+37)%W,y:(i*83+19)%H,r:i%7===0?2:1}));
function build(){bricks=[];const cols=10,rows=Math.min(4+Math.floor((level-1)/2),7);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level%3===2&&r>0&&(r+c)%4===0)continue;if(level%3===0&&Math.abs(c-4.5)>4-r*.45)continue;bricks.push({x:34+c*66,y:62+r*25,w:61,h:19,color:['#ff5454','#ffae43','#ffe35a','#6be169','#55bbef','#ba85ef','#f57bbe'][r],alive:true});}}
function dock(){launched=false;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=170;ball.vy=-260-level*15;}
function reset(){score=0;lives=3;level=1;over=false;won=false;paused=false;paddle.x=304;build();dock();}
function launch(){if(over){reset();return;}if(!paused)launched=true;}
function update(dt){if(paused||over)return;const dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x+dir*420*dt));if(!launched){ball.x=paddle.x+paddle.w/2;return;}const px=ball.x,py=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<12+ball.r){ball.x=12+ball.r;ball.vx=Math.abs(ball.vx);}if(ball.x>W-12-ball.r){ball.x=W-12-ball.r;ball.vx=-Math.abs(ball.vx);}if(ball.y<32+ball.r){ball.y=32+ball.r;ball.vy=Math.abs(ball.vy);}if(ball.vy>0&&py+ball.r<=paddle.y&&ball.y+ball.r>=paddle.y&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){ball.y=paddle.y-ball.r;let angle=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*1.05;const speed=Math.min(480,Math.hypot(ball.vx,ball.vy)+5);ball.vx=Math.sin(angle)*speed;ball.vy=-Math.cos(angle)*speed;}
for(const b of bricks){if(!b.alive)continue;const nx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),ny=Math.max(b.y,Math.min(ball.y,b.y+b.h));if((ball.x-nx)**2+(ball.y-ny)**2<=ball.r**2){b.alive=false;score+=10;if(px+ball.r<=b.x||px-ball.r>=b.x+b.w)ball.vx=-ball.vx;else ball.vy=-ball.vy;break;}}
if(ball.y-ball.r>H){lives--;if(lives===0)over=true;else dock();}if(bricks.every(b=>!b.alive)){if(level===8){over=true;won=true;}else{level++;score+=100;build();dock();}}
}
function draw(){ctx.fillStyle='#020409';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle=s.r===2?'#a4b7d0':'#566277';ctx.fillRect(s.x,s.y,s.r,s.r);}ctx.strokeStyle='#607084';ctx.strokeRect(11,31,W-22,H-32);for(const b of bricks){if(!b.alive)continue;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffffff60';ctx.fillRect(b.x+2,b.y+2,b.w-4,3);ctx.fillStyle='#00000055';ctx.fillRect(b.x+2,b.y+b.h-4,b.w-2,4);}ctx.fillStyle='#68ed36';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#ceff83';ctx.fillRect(paddle.x+3,paddle.y+2,paddle.w-6,3);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.font='16px monospace';ctx.fillStyle='#e9efff';ctx.fillText('PUAN '+String(score).padStart(5,'0'),22,23);ctx.fillText('CAN '+lives,325,23);ctx.fillText('BÖLÜM '+level+'/8',570,23);status.textContent=paused?'DURAKLATILDI':over?(won?'TAMAMLANDI':'OYUN BİTTİ'):launched?'OYUNDA':'HAZIR';if(paused||over||!launched){ctx.fillStyle='#020409cc';ctx.fillRect(145,245,430,88);ctx.textAlign='center';ctx.fillStyle='#7fff57';ctx.font='22px monospace';ctx.fillText(paused?'DURAKLATILDI':over?(won?'TEBRİKLER!':'OYUN BİTTİ'):'TOPU FIRLAT',W/2,279);ctx.fillStyle='#c8d0e0';ctx.font='14px monospace';ctx.fillText(paused?'Devam etmek için P':over?'Yeniden başlatmak için Enter':'Boşluk / Enter veya Başlat düğmesi',W/2,309);ctx.textAlign='left';}}
function frame(t){accumulator+=Math.min((t-last)/1000,.05);last=t;while(accumulator>=1/240){update(1/240);accumulator-=1/240;}draw();requestAnimationFrame(frame);}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase());if(!e.repeat){if(e.key===' '||e.key==='Enter')launch();if(e.key.toLowerCase()==='p'&&!over)paused=!paused;}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();if(launched&&!over)paused=true;});
for(const [id,key] of [['left','ArrowLeft'],['right','ArrowRight']]){const el=document.querySelector('#'+id);el.style.touchAction='none';el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);keys.add(key);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys.delete(key));}
let dragging=false;function move(e){const r=canvas.getBoundingClientRect();paddle.x=Math.max(12,Math.min(W-paddle.w-12,(e.clientX-r.left)*W/r.width-paddle.w/2));}canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);move(e);});canvas.addEventListener('pointermove',e=>{if(dragging)move(e);});canvas.addEventListener('pointerup',()=>{dragging=false;});canvas.addEventListener('pointercancel',()=>{dragging=false;});document.querySelector('#play').onclick=launch;document.querySelector('#pause').onclick=()=>{if(!over)paused=!paused;};document.querySelector('#reset').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
