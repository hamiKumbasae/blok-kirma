<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlokYıldızı</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #080c18; color: #e0e8f6; font-family: monospace; display: grid; place-items: center; min-height: 100dvh; }
  main { width: min(96vw, 900px); padding: 16px; }
  canvas { width: 100%; aspect-ratio: 1264 / 948; display: block; background: #020207; touch-action: none; margin: 12px 0; }
  button { background: #17243a; color: white; border: 1px solid #72819c; padding: 12px 20px; font: inherit; cursor: pointer; border-radius: 4px; touch-action: none; }
  button:hover { background: #294165; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  p { text-align: center; color: #95a2b9; line-height: 1.7; }
  /* TV modu: yalnız oyun alanı, ekranı doldurur */
  body.tv { overflow: hidden; }
  body.tv main { width: 100vw; height: 100vh; padding: 0; display: grid; place-items: center; }
  body.tv canvas { width: auto; height: 100vh; max-width: 100vw; margin: 0; }
  body.tv .controls, body.tv p { display: none; }
</style>
</head>
<body>
<main>
  <canvas aria-label="BlokYıldızı oyun alanı"></canvas>
  <div class="controls">
    <button id="left" aria-label="Sola / menüde yukarı">◀</button>
    <button id="play">Seç / Topu at</button>
    <button id="pause">Duraklat</button>
    <button id="right" aria-label="Sağa / menüde aşağı">▶</button>
    <button id="menu">Menü</button>
    <button id="speed">Hız 1.5×</button>
    <button id="lives">Can: sonsuz</button>
  </div>
  <p>Menü: ↑ ↓ ve Enter · Oyun: ← → / A D hareket, Boşluk / Enter topu at, P duraklat, H hız, L sonsuz can, Esc menü<br>
  Telefonda oyun alanını sürükle veya yön düğmelerini basılı tut.<br>
  Bilgisayarda ya da TV'de oynarken telefonunu kumanda yapmak için <b>Telefonla oyna</b> (K). Geliştirici modu: <code>?debug</code></p>
</main>
<script src="src/levels.js"></script>
<script src="src/game.js"></script>
<script src="src/remote.js"></script>
</body>
</html>
