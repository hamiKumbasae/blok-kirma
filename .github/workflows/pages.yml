# Oyunu GitHub Pages'te yayınlar ve Android TV uygulamasını (tv.apk) derleyip
# aynı siteye koyar: https://hamikumbasae.github.io/blok-kirma/tv.apk
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android TV uygulamasını derle
        run: |
          set -o pipefail
          if ! gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E "error|What went wrong|>|FAIL|Could not" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r index.html src _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/tv.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
